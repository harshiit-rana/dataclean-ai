services:
  redis:
    image: redis:8-alpine
    # Redis holds the LangGraph checkpoints, which *are* the sessions -- without persistence
    # a `docker compose down`, or any container restart, silently discards every session
    # someone had in progress. appendonly survives an unclean stop; the default RDB snapshot
    # points can lose the last minute of writes.
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    # --reload for local dev: app/ is bind-mounted below, so code edits apply without a
    # rebuild or restart. The image's own CMD (no --reload) is what runs in production.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      REDIS_HOST: redis
      # The bundled setup is for trying the app locally: development turns session tokens off (and the app logs a
      # warning saying so). A hosted instance must not run with this -- the default, unset, requires tokens.
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      redis:
        condition: service_healthy
    # Ready, not merely up: Redis answers and the graph was built (GET /health/ready).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - backend_uploads:/app/uploads

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: on Alpine localhost resolves to ::1 first, and Vite listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src

volumes:
  backend_uploads:
  redis_data:
