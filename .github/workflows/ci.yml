name: CI

# The runner image is pinned on purpose. `ubuntu-latest` moves to a new Ubuntu release on
# GitHub's schedule, which can change system libraries (WeasyPrint's, for one) and break the
# backend job with no change to this repo. Bump `ubuntu-24.04` deliberately, in a commit of its
# own, and read the run before trusting it.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Lint and type checks, apart from the tests so they fail in seconds rather than after the suite.
  backend-static:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check app

      - name: Type check
        run: mypy app

  backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # In parallel, one worker per CPU. --dist loadfile keeps each test file in one worker, so a file's module-level
      # fixtures (trained models, a TestClient) are built once and nothing in a file runs concurrently with itself.
      # Every test gets its own upload folder (tests/conftest.py), so files never share state on disk.
      - name: Run pytest
        run: python -m pytest --cov=app -n auto --dist loadfile
        env:
          ANTHROPIC_API_KEY: test-key-not-real

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      # After the tests: a type error should surface as a failing build, but a broken
      # behaviour is worth hearing about first.
      - name: Build
        run: npm run build

  # The documented way to run the app, run: both images built, the stack started and waited on until every
  # service's healthcheck passes (the backend's checks Redis and the graph), a sample uploaded, then torn down.
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: |
          cp .env.example .env
          sed -i 's/^ANTHROPIC_API_KEY=.*/ANTHROPIC_API_KEY=test-key-not-real/' .env

      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Upload a sample
        run: |
          response=$(curl --fail --silent --show-error -F "file=@samples/customers.csv" http://localhost:8000/api/upload)
          echo "$response" | grep -q '"session_id"'
          curl --fail --silent http://localhost:8000/health/ready
          curl --fail --silent --output /dev/null http://localhost:5173

      # Training goes through the worker container (#103), and a kept project is deleted with its checkpoint in a
      # real Redis (#120): the two things the unit tests can only fake.
      - name: Train through the worker, keep and delete a project
        run: |
          set -e
          upload=$(curl --fail --silent --show-error -F "file=@samples/subscription_churn.csv" http://localhost:8000/api/upload)
          sid=$(echo "$upload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["session_id"])')
          tok=$(echo "$upload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["session_token"])')
          auth="X-Session-Token: $tok"
          curl --fail --silent --show-error -H "$auth" -H 'Content-Type: application/json'             -d '{"use_case":"ml_training","expected_output":"churn model","target_column":"churned"}'             "http://localhost:8000/api/goal/$sid"
          curl --fail --silent --show-error -H "$auth" -H 'Content-Type: application/json' --max-time 600             -d '{"model_names":["logistic_regression"],"include_deep_diagnostics":false,"excluded_columns":["customer_id","first_name","last_name","email"]}'             "http://localhost:8000/api/model/$sid/train" > train.json
          python3 -c 'import json; r=json.load(open("train.json")); assert r["best_model"]=="logistic_regression", r'
          docker compose logs worker | grep -q "Running job"
          curl --fail --silent --show-error -H "$auth" -H 'Content-Type: application/json' -d '{"name":"CI project"}'             "http://localhost:8000/api/session/$sid/keep" | grep -q '"kept":true'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:8000/api/session/$sid/project")" = 403
          curl --fail --silent --show-error -H "$auth" -X DELETE "http://localhost:8000/api/session/$sid" > deleted.json
          python3 -c 'import json; r=json.load(open("deleted.json")); assert r["checkpoint_deleted"] is True and r["files_removed"] > 0, r'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "$auth" "http://localhost:8000/api/session/$sid/project")" = 404

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
