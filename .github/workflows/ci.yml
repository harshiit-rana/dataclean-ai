name: CI

# The runner image is pinned on purpose. `ubuntu-latest` moves to a new Ubuntu release on
# GitHub's schedule, which can change system libraries (WeasyPrint's, for one) and break the
# backend job with no change to this repo. Bump `ubuntu-24.04` deliberately, in a commit of its
# own, and read the run before trusting it.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Lint and type checks, apart from the tests so they fail in seconds rather than after the suite.
  backend-static:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check app

      - name: Type check
        run: mypy app

  backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest --cov=app
        env:
          ANTHROPIC_API_KEY: test-key-not-real

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      # After the tests: a type error should surface as a failing build, but a broken
      # behaviour is worth hearing about first.
      - name: Build
        run: npm run build
